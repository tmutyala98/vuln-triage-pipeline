name: Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the scan target (Juice Shop)
        uses: actions/checkout@v5
        with:
          repository: juice-shop/juice-shop
          path: target

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config p/default --json --output semgrep.json target

      - name: Upload report
        uses: actions/upload-artifact@v6
        with:
          name: semgrep-report
          path: semgrep.json

  trivy:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Scan the Juice Shop image for vulnerable libraries
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:latest image \
            --format json --output /work/trivy.json \
            bkimminich/juice-shop:latest

      - name: Upload report
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report
          path: trivy.json

  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out Juice Shop with full history
        uses: actions/checkout@v5
        with:
          repository: juice-shop/juice-shop
          path: target
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Run Gitleaks
        run: ./gitleaks detect --source target --report-format json --report-path gitleaks.json --exit-code 0

      - name: Upload report
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-report
          path: gitleaks.json

  zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - name: Start Juice Shop
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop:latest
          for i in $(seq 1 30); do
            curl -s http://localhost:3000 > /dev/null && break
            sleep 2
          done

      - name: Run ZAP baseline scan
        run: |
          chmod 777 "$PWD"
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -J zap.json -I || true

      - name: Upload report
        uses: actions/upload-artifact@v6
        with:
          name: zap-report
          path: zap.json

  triage:
    name: Triage and security gate
    runs-on: ubuntu-latest
    needs: [semgrep, trivy, gitleaks, zap]
    steps:
      - name: Check out this repository
        uses: actions/checkout@v5

      - name: Download all scan reports
        uses: actions/download-artifact@v6
        with:
          path: reports
          merge-multiple: true

      - name: Normalize and deduplicate
        run: python3 triage.py reports

      - name: Enrich, score and report
        run: python3 enrich.py

      - name: Draft AI remediation guidance
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 remediate.py

      - name: Show report on the run page
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload triage report
        uses: actions/upload-artifact@v6
        with:
          name: triage-report
          path: |
            report.md
            prioritized.json

      - name: Security gate (fail on P1)
        run: |
          p1=$(python3 -c "import json; print(sum(f['priority'] == 'P1' for f in json.load(open('prioritized.json'))))")
          echo "P1 findings: $p1"
          if [ "$p1" -gt 0 ]; then
            echo "::error::Security gate failed: $p1 P1 findings"
            exit 1
          fi