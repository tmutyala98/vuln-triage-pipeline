name: Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the scan target (Juice Shop)
        uses: actions/checkout@v4
        with:
          repository: juice-shop/juice-shop
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config p/default --json --output semgrep.json target

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json